name: GPU benchmark

# The GPU-sharing benchmark (design §9.5, §10) on a self-hosted runner with an NVIDIA GPU, labeled
# "gpu". Run it from the Actions tab; the report is uploaded as an artifact, to be committed under
# bench/reports/.
on:
  workflow_dispatch:
    inputs:
      device:
        description: CUDA device to benchmark
        default: "cuda:0"
      size:
        description: Model size (tiny, small, base)
        default: "base"

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - name: GPU
        run: nvidia-smi
      - name: Install (with PyTorch and LeRobot)
        run: make models-setup
      - name: Benchmark
        env:
          DEVICE: ${{ inputs.device }}
          SIZE: ${{ inputs.size }}
        run: >-
          uv run --group models neura-bench run --preset gpu
          --device "$DEVICE" --size "$SIZE" --out bench-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-report
          path: bench-report
