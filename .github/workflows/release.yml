name: Release

# A release from a version tag (vX.Y.Z), after all of CI passes on it (design §17.7, §18.2):
#
# - every image is built once, pushed to GHCR by digest, scanned for known vulnerabilities (a
#   critical one stops the release), signed keyless with Sigstore (cosign, this workflow's GitHub
#   identity), with a CycloneDX SBOM attached as a signed attestation and SLSA build provenance;
# - the site-agent release bundle is built and signed with Neura's Ed25519 release key (the
#   NEURA_RELEASE_SIGNING_KEY secret), the key sites pin at install and verify every upgrade
#   against; the bundle gets an SBOM and provenance too;
# - a GitHub release lists every digest and how to verify it.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Image ${{ matrix.target }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        target:
          - neura-control
          - neura-agent
          - neura-agent-gpu
          - neura-gateway
          - neura-worker
          - neura-worker-gpu
          - neura-sim-robots
          - neura-console
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Disk space for the CUDA images
        if: endsWith(matrix.target, '-gpu')
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ matrix.target }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Known vulnerabilities in the image
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          sbom: ${{ matrix.target }}.cdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table
      - name: Attest the SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign attest --yes --type cyclonedx --predicate "${{ matrix.target }}.cdx.json"
          "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" > "${{ matrix.target }}.digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.target }}
          path: |
            ${{ matrix.target }}.digest
            ${{ matrix.target }}.cdx.json

  agent:
    name: Site-agent release bundle
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - name: The tag is the packages' version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("packages/neura-agent/pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$TAG" || { echo "tag $TAG but neura-agent is $version"; exit 1; }
      - name: Build and sign
        env:
          NEURA_RELEASE_SIGNING_KEY: ${{ secrets.NEURA_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$NEURA_RELEASE_SIGNING_KEY" || { echo "NEURA_RELEASE_SIGNING_KEY is not set"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/release.pem"
          printf '%s\n' "$NEURA_RELEASE_SIGNING_KEY" > "$key"
          uv sync --frozen
          mkdir -p dist
          uv run python tools/build_agent_release.py build --key "$key" --out dist \
            | tee "$RUNNER_TEMP/bundle.txt"
          rm -f "$key"
          mv "$RUNNER_TEMP/bundle.txt" dist/neura-agent.sha256.txt
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: cyclonedx-json
          output-file: dist/neura-agent.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/neura-agent-*.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent
          path: dist

  release:
    name: GitHub release
    needs: [images, agent]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Images"
            echo
            echo "Every image is signed keyless by this repository's release workflow, with a signed"
            echo "CycloneDX SBOM attestation and SLSA build provenance. Deploy by digest:"
            echo
            echo '```'
            cat artifacts/image-*/*.digest
            echo '```'
            echo
            echo "Verify an image before you run it:"
            echo
            echo '```bash'
            echo "cosign verify <image>@<digest> \\"
            echo "  --certificate-identity-regexp '^https://github.com/$REPO/.github/workflows/release.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://<image>@<digest> --repo $REPO"
            echo '```'
            echo
            echo "## Site agent"
            echo
            echo "The bundle is signed with Neura's release key; the installer verifies it with"
            echo "openssl before it installs anything, and sites verify every upgrade the same way."
            echo
            echo '```'
            cat artifacts/agent/neura-agent.sha256.txt
            echo '```'
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Neura $TAG"
          --notes-file notes.md --verify-tag
          artifacts/agent/neura-agent-*.tar artifacts/agent/neura-agent.cdx.json
          artifacts/image-*/*.cdx.json
