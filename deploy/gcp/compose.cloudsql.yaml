# The database for deploy/gcp/compose.yaml with NEURA_DATABASE=cloudsql: Cloud SQL over the Admin
# API's mutual TLS, through the proxy, with the VM's service account.
services:
  db:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.28.0@sha256:e0cbea7b63455c1635d354ef456696d019dd02a5db47bf1994e849823e71ae89
    command: ["--address=0.0.0.0", "--port=5432", "${SQL_INSTANCE:?}"]
    restart: unless-stopped
