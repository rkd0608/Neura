[project]
name = "neura-sdk"
version = "0.1.0.dev0"
description = "Python client for the Neura management API, generated from its OpenAPI spec."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
