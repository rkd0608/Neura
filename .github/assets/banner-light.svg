<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Neura by NucleiLabs: run your robot policies across your fleet, on your GPUs.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="10%" r="60%">
      <stop offset="0" stop-color="#7c63ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c63ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121216"/>
      <stop offset="0.55" stop-color="#5a41d8"/>
      <stop offset="1" stop-color="#2f6fd6"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b9ff"/><stop offset="1" stop-color="#6a52e8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(15,15,30,0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="30%" r="65%">
      <stop offset="0.3" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1280" height="330" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1280" height="330" rx="20" fill="#fafafb"/>
  <rect width="1280" height="330" rx="20" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1280" height="330" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="329" rx="19.5" fill="none" stroke="#e5e5ea"/>
  <g transform="translate(560 58)">
    <rect width="160" height="34" rx="17" fill="#ffffff" stroke="#e5e5ea"/>
    <g transform="translate(10 5) scale(0.75)">
      <rect width="32" height="32" rx="8" fill="#141220"/>
      <g fill="none" stroke="url(#mark)" stroke-width="1.8">
        <ellipse cx="16" cy="16" rx="11" ry="4.6"/>
        <ellipse cx="16" cy="16" rx="11" ry="4.6" transform="rotate(60 16 16)"/>
        <ellipse cx="16" cy="16" rx="11" ry="4.6" transform="rotate(-60 16 16)"/>
      </g>
      <circle cx="16" cy="16" r="2.6" fill="#c4b9ff"/>
    </g>
    <text x="44" y="22.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#121216">NucleiLabs</text>
  </g>
  <text x="640" y="182" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="88" font-weight="700" letter-spacing="-4" fill="url(#ink)">Neura</text>
  <text x="640" y="238" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="27" font-weight="500" letter-spacing="-0.5" fill="#121216">Run your robot policies across your fleet, on your GPUs.</text>
  <text x="640" y="282" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#4d4d58">Deploy, shadow-test, approve and roll back policies on real robots, from servers at your site.</text>
</svg>
