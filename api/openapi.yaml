components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.invalid/.well-known/openid-configuration
      description: Customer SSO; authorization code with PKCE for the console.
    apiToken:
      type: http
      scheme: bearer
      description: Scoped, expiring API token.
  parameters:
    ActivationRequestId:
      name: activation_request_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ActivationRequestId'
    ApiTokenId:
      name: api_token_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiTokenId'
    AuditRecordId:
      name: audit_record_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AuditRecordId'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DeploymentId'
    EnrollmentTokenId:
      name: enrollment_token_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EnrollmentTokenId'
    ExecutionProfileId:
      name: execution_profile_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ExecutionProfileId'
    FaultId:
      name: fault_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FaultId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every POST. A repeated key with the same body returns the original result;
        with a different body it returns API_IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The resource version (ETag) the change is based on.
      schema:
        type: string
    LabelSelector:
      name: label
      in: query
      description: Filter by label, `key=value`. Repeat to AND several labels.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    ModelArtifactId:
      name: model_artifact_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ModelArtifactId'
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OperationId'
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OrganizationId'
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ProjectId'
    RevisionId:
      name: revision_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RevisionId'
    RobotId:
      name: robot_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RobotId'
    RobotProfileId:
      name: robot_profile_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RobotProfileId'
    RollbackId:
      name: rollback_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RollbackId'
    ServerId:
      name: server_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ServerId'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SessionId'
    SiteId:
      name: site_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SiteId'
    SupportGrantId:
      name: support_grant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SupportGrantId'
  headers:
    ETag:
      description: Resource version for optimistic concurrency.
      schema:
        type: string
    Location:
      description: URL of the created resource.
      schema:
        type: string
    RateLimitLimit:
      schema:
        type: integer
    RateLimitRemaining:
      schema:
        type: integer
    RetryAfter:
      schema:
        type: integer
      description: Seconds to wait.
  responses:
    Conflict:
      description: API_CONFLICT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: API_FORBIDDEN
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: API_INTERNAL_ERROR
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: API_NOT_FOUND
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: API_PRECONDITION_FAILED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: API_IDEMPOTENCY_KEY_REQUIRED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: API_RATE_LIMITED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    Unauthenticated:
      description: API_UNAUTHENTICATED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: API_UNAVAILABLE
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: API_VALIDATION_FAILED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ActivationRequest:
      type: object
      description: A request to activate a prepared revision. Motion requires local approval at the site
        at a task boundary; the cloud cannot authorize it (design §20.9).
      required:
      - metadata
      - revision_id
      - robot_ids
      - operation_id
      - state
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        revision_id:
          $ref: '#/components/schemas/RevisionId'
        robot_ids:
          type: array
          items:
            $ref: '#/components/schemas/RobotId'
        operation_id:
          $ref: '#/components/schemas/OperationId'
        state:
          enum:
          - AwaitingLocalApproval
          - Approved
          - Refused
          - Activated
          - Failed
          - Cancelled
        approved_by:
          type:
          - string
          - 'null'
          description: Local operator identity.
        note:
          type: string
    ActivationRequestCreate:
      type: object
      required:
      - revision_id
      properties:
        revision_id:
          $ref: '#/components/schemas/RevisionId'
        robot_ids:
          type: array
          items:
            $ref: '#/components/schemas/RobotId'
          uniqueItems: true
          description: Defaults to the rollout strategy's robots.
        note:
          type: string
          maxLength: 2000
      additionalProperties: false
    ActivationRequestId:
      type: string
      pattern: ^actr_[0-9A-HJKMNP-TV-Z]{26}$
      description: 'ActivationRequest identifier: `actr_` followed by a ULID.'
      examples:
      - actr_01JA2B3C4D5E6F7G8H9JKMNPQR
    ActivationRequestPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivationRequest'
        page:
          $ref: '#/components/schemas/PageInfo'
    ApiToken:
      type: object
      required:
      - metadata
      - display_name
      - scopes
      - expires_at
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiTokenScope'
        project_ids:
          type: array
          items:
            $ref: '#/components/schemas/ProjectId'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
    ApiTokenCreate:
      type: object
      required:
      - display_name
      - scopes
      - expires_in_days
      properties:
        display_name:
          $ref: '#/components/schemas/DisplayName'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiTokenScope'
          minItems: 1
          uniqueItems: true
        project_ids:
          type: array
          items:
            $ref: '#/components/schemas/ProjectId'
          uniqueItems: true
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
      additionalProperties: false
    ApiTokenId:
      type: string
      pattern: ^tok_[0-9A-HJKMNP-TV-Z]{26}$
      description: 'ApiToken identifier: `tok_` followed by a ULID.'
      examples:
      - tok_01JA2B3C4D5E6F7G8H9JKMNPQR
    ApiTokenPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
        page:
          $ref: '#/components/schemas/PageInfo'
    ApiTokenScope:
      type: string
      enum:
      - read
      - deploy
      - admin
      description: Token scopes. No token scope can approve physical activation (design §19.2).
    ApiTokenWithSecret:
      allOf:
      - $ref: '#/components/schemas/ApiToken'
      required:
      - secret
      properties:
        secret:
          type: string
          description: Shown once, in this response only.
    AuditRecord:
      type: object
      readOnly: true
      required:
      - metadata
      - actor
      - action
      - target
      - result
      - occurred_at
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        actor:
          type: string
        actor_kind:
          enum:
          - user
          - api_token
          - site_agent
          - support
          - system
        action:
          type: string
          examples:
          - deployment.update
          - activation_request.create
        target:
          type: string
        result:
          enum:
          - succeeded
          - failed
          - denied
        reason:
          oneOf:
          - $ref: '#/components/schemas/ReasonCode'
          - type: 'null'
        request_id:
          type: string
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    AuditRecordId:
      type: string
      pattern: ^aud_[0-9A-HJKMNP-TV-Z]{26}$
      description: 'AuditRecord identifier: `aud_` followed by a ULID.'
      examples:
      - aud_01JA2B3C4D5E6F7G8H9JKMNPQR
    AuditRecordPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        page:
          $ref: '#/components/schemas/PageInfo'
    CompatibilityCheckRequest:
      type: object
      required:
      - model_artifact_id
      - robot_profile_id
      - execution_profile_id
      properties:
        model_artifact_id:
          $ref: '#/components/schemas/ModelArtifactId'
        robot_profile_id:
          $ref: '#/components/schemas/RobotProfileId'
        execution_profile_id:
          $ref: '#/components/schemas/ExecutionProfileId'
      additionalProperties: false
    CompatibilityIssue:
      type: object
      required:
      - code
      - path
      - message
      properties:
        code:
          $ref: '#/components/schemas/ReasonCode'
        path:
          type: string
        message:
          type: string
    CompatibilityReport:
      type: object
      required:
      - compatible
      - artifact_digest
      - robot_profile_digest
      - execution_profile_digest
      - issues
      properties:
        compatible:
          type: boolean
        artifact_digest:
          $ref: '#/components/schemas/Digest'
        robot_profile_digest:
          $ref: '#/components/schemas/Digest'
        execution_profile_digest:
          $ref: '#/components/schemas/Digest'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilityIssue'
    ConsolePhase:
      type: string
      enum:
      - Unknown
      - Preparing
      - Ready
      - Running
      - Waiting
      - NeedsAttention
      - Offline
      description: Observed phase shown in the console (design §19.4).
    ContractDocument:
      type: object
      description: A contract document (ModelArtifact, RobotProfile or ExecutionProfile) as defined by
        the JSON Schemas in schemas/. Validated server-side by neura-contracts.
      required:
      - api_version
      - kind
      - metadata
      - spec
      properties:
        api_version:
          const: neura.dev/v1alpha1
        kind:
          enum:
          - ModelArtifact
          - RobotProfile
          - ExecutionProfile
        metadata:
          type: object
        spec:
          type: object
      additionalProperties: false
    Deployment:
      type: object
      required:
      - metadata
      - spec
      - status
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/DeploymentSpec'
        status:
          type: object
          readOnly: true
          required:
          - phase
          description: Desired, prepared and active revisions are reported separately; a successful request
            never implies a robot runs the revision (design §20.2).
          properties:
            phase:
              $ref: '#/components/schemas/DeploymentPhase'
            reason:
