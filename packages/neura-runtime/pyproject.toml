[project]
name = "neura-runtime"
version = "0.1.0.dev0"
description = "Neura robot runtime: action queue, chunk merging, fencing, state machine and session client."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "neura-contracts",
    "neura-proto",
    "numpy>=2.2",
    "grpcio>=1.84,<2",
    # Incident records (neura_runtime.incident), as Foxglove and Rerun read them.
    "mcap>=1.2",
]

[project.optional-dependencies]
# Policies behind an openpi policy server (neura_runtime.openpi): its websocket and msgpack wire.
openpi = ["msgpack>=1.1", "websockets>=13"]
# Policies behind LeRobot's async inference server (neura_runtime.lerobot_server).
lerobot = ["lerobot>=0.6.1,<0.7"]

[project.scripts]
neura-robot = "neura_runtime.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
