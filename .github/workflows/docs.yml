name: Docs site

# Publishes the developer docs (design §26) to GitHub Pages from main. Every pull request builds
# the site in CI (the `docs` job) and uploads it as the `docs-site` artifact, a preview to
# download. Set NEURA_DOCS_URL and NEURA_DOCS_BASE_URL as repository variables for another host
# or domain.
on:
  push:
    branches: [main]
    paths: ["site/**", "catalog/**", "api/**", "proto/**", "packages/neura-sdk/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.28.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: |
          uv sync --frozen
          make docs-setup
      - name: Check and build
        env:
          NEURA_DOCS_URL: ${{ vars.NEURA_DOCS_URL }}
          NEURA_DOCS_BASE_URL: ${{ vars.NEURA_DOCS_BASE_URL }}
        run: make docs-check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
