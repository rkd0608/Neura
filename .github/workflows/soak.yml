name: Soak and chaos

# The long runs behind the M7 exit criterion (design §16.1, §17.7): a 72-hour soak of the
# simulated site with injected faults, for each reference model and merge mode, and half an hour
# of chaos against real gateway and worker processes. Every run is watched by the independent
# invariant monitor; any violation fails the job. Weekly, and on demand from the Actions tab.
on:
  schedule:
    - cron: "17 2 * * 6"
  workflow_dispatch:
    inputs:
      hours:
        description: Simulated hours per soak
        default: "72"
      chaos_seconds:
        description: Seconds of real-process chaos
        default: "1800"

permissions:
  contents: read

jobs:
  soak:
    name: Soak (${{ matrix.model }}, ${{ matrix.merge }})
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: act, merge: replace, seed: 1}
          - {model: smolvla, merge: replace, seed: 2}
          - {model: act, merge: blend, seed: 3}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - name: Install
        run: uv sync --frozen
      - name: Soak
        env:
          HOURS: ${{ inputs.hours || '72' }}
        run: >-
          uv run neura-sim-soak --hours "$HOURS" --model ${{ matrix.model }}
          --merge ${{ matrix.merge }} --seed ${{ matrix.seed }}
          --report soak/${{ matrix.model }}-${{ matrix.merge }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak-${{ matrix.model }}-${{ matrix.merge }}
          path: soak

  chaos:
    name: Real-process chaos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - name: Install
        run: uv sync --frozen
      - name: Chaos
        env:
          SECONDS_OF_CHAOS: ${{ inputs.chaos_seconds || '1800' }}
        run: >-
          uv run neura-chaos --duration "$SECONDS_OF_CHAOS" --workdir chaos
          --report chaos/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chaos
          path: chaos
