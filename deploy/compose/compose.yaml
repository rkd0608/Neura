# Local development stack: `make dev`. Not a production deployment.
#
# - postgres:       control-plane metadata store
# - control-plane:  management API (cloud side)
# - site-agent:     agent as it would run on a customer GPU server, dialing out to the control plane
# - gateway:        site data plane (gateway, scheduler, mock policy worker) on that server
# - sim-robots:     four simulated arms running the real robot runtime against the gateway
name: neura-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neura
      POSTGRES_PASSWORD: neura
      POSTGRES_DB: neura
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neura -d neura"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: neura-control
      secrets: [ca_bundle]
    image: neura-control:dev
    command: ["sh", "-c", "neura-control migrate && exec neura-control serve"]
    environment:
      NEURA_CONTROL_ENVIRONMENT: development
      NEURA_CONTROL_DATABASE_URL: postgresql://neura:neura@postgres:5432/neura
      NEURA_CONTROL_PUBLIC_URL: http://127.0.0.1:8080
      # DEVELOPMENT ONLY: a public admin token for the local stack. Generate another with
      # `uv run neura-control dev-token`. Refused outside the development environment.
      NEURA_CONTROL_DEV_BOOTSTRAP_TOKEN: ntk_tok_01M4Y8WAYQCVACJ83FY3EZEDKR_F_4TsgyKux5toXDLnOLpsAvLyWNlDAHK0WMN6dUBIXw
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  site-agent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: neura-agent
      secrets: [ca_bundle]
    image: neura-agent:dev
    environment:
      NEURA_AGENT_CONTROL_PLANE_URL: http://control-plane:8080
      NEURA_AGENT_PROBE_INTERVAL_S: "2"
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      control-plane:
        condition: service_healthy

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: neura-gateway
      secrets: [ca_bundle]
    image: neura-gateway:dev
    volumes:
      - ../dev:/srv/neura/deploy/dev:ro
      - ../../examples:/srv/neura/examples:ro
      - gateway-state:/var/lib/neura
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:8091:8091"

  sim-robots:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: neura-sim-robots
      secrets: [ca_bundle]
    image: neura-sim-robots:dev
    environment:
      NEURA_SIM_GATEWAY: gateway:50051
      NEURA_SIM_ROBOTS: "4"
      NEURA_SIM_REVISION: rev_dev
      NEURA_SIM_ARTIFACT: examples/contracts/act-so101.artifact.yaml
      NEURA_SIM_ROBOT_PROFILE: examples/contracts/so101.robot.yaml
      NEURA_SIM_EXECUTION_PROFILE: examples/contracts/act-so101-30hz.profile.yaml
    volumes:
      - ../../examples:/srv/neura/examples:ro
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
  gateway-state:

secrets:
  # Optional CA bundle for builds behind a TLS-intercepting proxy. Defaults to an empty file.
  ca_bundle:
    file: ${NEURA_BUILD_CA_BUNDLE:-/dev/null}
