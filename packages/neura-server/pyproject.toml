[project]
name = "neura-server"
version = "0.1.0.dev0"
description = "Neura site data plane: gateway, leases, admission, scheduler and policy workers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "neura-adapters",
    "neura-contracts",
    "neura-proto",
    "neura-runtime",
    "numpy>=2.2",
    "grpcio>=1.84,<2",
    "pyyaml>=6.0.2",
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.38",
]

[project.scripts]
neura-gateway = "neura_server.__main__:main"
neura-worker = "neura_server.worker:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
