[project]
name = "neura-proto"
version = "0.1.0.dev0"
description = "Generated protobuf and gRPC bindings for the Neura protocol (neura.v1)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.84,<2",
    "protobuf>=6.31",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "neura"
