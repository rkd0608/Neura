        labels:
          $ref: '#/components/schemas/Labels'
      additionalProperties: false
    DeploymentUpdate:
      type: object
      description: JSON Merge Patch (RFC 7396) of the mutable spec fields.
      properties:
        spec:
          type: object
          properties:
            display_name:
              $ref: '#/components/schemas/DisplayName'
            labels:
              $ref: '#/components/schemas/Labels'
