# Lint, types, tests and the quickstart on every supported Python and architecture; the extras,
# the Docker tests and a clean install of the built wheel.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev,openpi]"
      - name: Lint, types, tests and the quickstart
        run: make check PYTHON=.venv/bin/python

  extras:
    name: Extras (LeRobot, SO-101 emulator, MuJoCo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev,openpi,so101,lerobot,sim]"
      - name: Tests
        run: .venv/bin/python -m pytest

  docker:
    name: openpi's server and ROS 2 Jazzy (Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,openpi]"
      - name: Build the images and run the tests
        run: make test-docker PYTHON=.venv/bin/python

  package:
    name: Build and install the wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"
      - name: Build
        run: uv build
      - name: Install the wheel alone and run the quickstart
        run: |
          uv venv --python 3.10 /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd /tmp && /tmp/clean/bin/neura-robot --help && /tmp/clean/bin/neura-arm --help
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/examples/quickstart.py"
