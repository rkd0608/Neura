name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.13"

jobs:
  checks:
    name: Lint, types, generated files, tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neura
          POSTGRES_PASSWORD: neura
          POSTGRES_DB: neura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neura -d neura"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NEURA_TEST_DATABASE_URL: postgresql://neura:neura@127.0.0.1:5432/neura
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Generated files are current
        run: make check-generated
      - name: Tests
        run: uv run pytest

  dev-stack:
    name: Dev stack smoke test
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build, start and verify
        run: tools/smoke_dev_stack.sh
