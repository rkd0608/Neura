# Dependency updates (design §18.2, supply chain). Actions are pinned to commit SHAs and images
# to digests; Dependabot proposes the new pins with their version comments. Every update goes
# through CI, including the dependency audit. Updates go to main, the default branch.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: main
    schedule: {interval: weekly}
    open-pull-requests-limit: 10
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /console
    target-branch: main
    schedule: {interval: weekly}
    groups:
      console-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /landing
    target-branch: main
    schedule: {interval: weekly}
    groups:
      landing-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /site
    target-branch: main
    schedule: {interval: weekly}
    groups:
      docs-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: main
    schedule: {interval: weekly}
  # The images production runs beside Neura's own (the edge, the database, certbot, the Cloud SQL
  # proxy: deploy/gcp/compose*.yaml) and the dev stack's (deploy/compose).
  - package-ecosystem: docker-compose
    directory: /deploy/gcp
    target-branch: main
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    target-branch: main
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "neura-*" # built from this repository (deploy/docker), not pulled
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
