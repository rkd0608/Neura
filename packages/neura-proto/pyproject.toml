[project]
name = "neura-proto"
version = "0.1.0.dev0"
description = "Generated protobuf and gRPC bindings for the Neura protocol (neura.v1)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.84,<2",
    "protobuf>=6.31",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "neura"

# Published as neura-robot, which runs on robot computers' own Python: 3.10 and later (design §30).
[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py310"
