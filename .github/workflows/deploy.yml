name: Deploy

# Deploys Neura's cloud side to Google Cloud with deploy/gcp/deploy.sh (design §20.10). It runs only
# when started by hand (Actions → Deploy → Run workflow), never on a push.
#
# Needs the GCP_SA_KEY secret, in the "production" environment or the repository: the full JSON key
# of a service account with the Owner role on the project. The project is the key's. Optional
# repository variables: NEURA_DOMAIN, NEURA_ACME_EMAIL, NEURA_CONTACT_URL.
#
# The first admin API token is never printed here: read it in the Cloud console (Secret Manager →
# neura-admin-token) or with `deploy/gcp/deploy.sh admin-token`.
on:
  workflow_dispatch:
    inputs:
      command:
        description: >-
          up: create or update the infrastructure, then release. release: ship this commit. pause: stop
          the VMs and Cloud SQL (disks and data kept). resume: start Neura again. delete-cloudsql:
          after a move to the Postgres container.
        type: choice
        options: [up, release, pause, resume, delete-cloudsql]
        default: up
      database:
        description: "Database (default: the one deployed, else postgres). postgres over a Cloud SQL deployment moves it."
        type: choice
        options: ["", postgres, cloudsql]
        default: ""
      machine_type:
        description: "VM machine type for up and resume (default e2-micro)"
        type: string
        required: false
      domain:
        description: "Domain (default: the NEURA_DOMAIN variable, else the one already deployed, else <ip>.sslip.io)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.13"

jobs:
  deploy:
    name: ${{ inputs.command }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # deploy.sh needs uv only to make the first keys; nothing worth caching.
          enable-cache: false
      - name: Deploy
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          COMMAND: ${{ inputs.command }}
          NEURA_DOMAIN: ${{ inputs.domain || vars.NEURA_DOMAIN }}
          NEURA_DATABASE: ${{ inputs.database }}
          NEURA_MACHINE_TYPE: ${{ inputs.machine_type }}
          NEURA_ACME_EMAIL: ${{ vars.NEURA_ACME_EMAIL }}
          NEURA_CONTACT_URL: ${{ vars.NEURA_CONTACT_URL }}
        shell: bash
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::Add the GCP_SA_KEY secret: Settings → Environments → production → Add secret"
            exit 1
          fi
          # Empty inputs mean the script's defaults.
          [ -n "$NEURA_DATABASE" ] || unset NEURA_DATABASE
          [ -n "$NEURA_MACHINE_TYPE" ] || unset NEURA_MACHINE_TYPE
          deploy/gcp/deploy.sh "$COMMAND" | tee -a "$GITHUB_STEP_SUMMARY"
