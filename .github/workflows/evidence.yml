name: Evidence

# Published policies on the scenes they were trained for, served by Neura and by the in-process
# alternatives, with the same seeds (packages/neura-robots/src/neura_robots/evidence). Started by
# hand: it downloads checkpoints from the Hugging Face Hub and runs for tens of minutes on CPU.
#
# - reference: LeRobot's own lerobot-eval on gym-aloha (dm_control, Python 3.12), the protocol
#   LeRobot publishes its success rates with, and gym-aloha's side of the fidelity check;
# - evidence: the fidelity check of Neura's MuJoCo port against it (step for step), then
#   neura-evidence closed-loop for every system, compared seed by seed with the reference;
# - faults: the same faults (latency, a network stall, the model process killed) for Neura and
#   LeRobot's own remote inference.
on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: "LeRobot checkpoint on the Hub"
        type: string
        default: lerobot/act_aloha_sim_transfer_cube_human
      task:
        description: "ALOHA task the checkpoint was trained on"
        type: choice
        options: [transfer_cube, insertion]
        default: transfer_cube
      episodes:
        description: "Episodes per system (seeds from 1000)"
        type: number
        default: 50
      systems:
        description: "Systems to run (closed loop)"
        type: string
        default: lerobot-eval,lerobot-realtime,neura,lerobot-async-scaled,lerobot-async
      fault_episodes:
        description: "Episodes per system and fault scenario (0: skip the faults job)"
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: evidence
  cancel-in-progress: false

# bash -eo pipefail: a step piped into tee fails when its command does.
defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.13"
  MUJOCO_GL: egl

jobs:
  reference:
    name: lerobot-eval on gym-aloha
    runs-on: ubuntu-24.04
    # gym-aloha renders three 640x480 cameras every step (software OpenGL here): about a minute
    # or more per episode on a runner.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Headless OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libosmesa6
      - name: LeRobot with gym-aloha (Python 3.12)
        run: |
          uv venv -q -p 3.12 /tmp/ref
          uv pip install -q --python /tmp/ref --torch-backend cpu "lerobot[aloha]==0.6.1"
      - name: The checkpoint, migrated to LeRobot's processor format by LeRobot's own tool
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          /tmp/ref/bin/python -m lerobot.processor.migrate_policy_normalization \
            --pretrained-path "$CHECKPOINT" --output-dir out/reference/checkpoint
          ls -la out/reference/checkpoint
      - name: lerobot-eval
        env:
          TASK: ${{ inputs.task }}
          EPISODES: ${{ inputs.episodes }}
        run: |
          case "$TASK" in
            transfer_cube) GYM=AlohaTransferCube-v0 ;;
            insertion) GYM=AlohaInsertion-v0 ;;
          esac
          /tmp/ref/bin/lerobot-eval --policy.path=out/reference/checkpoint --policy.device=cpu \
            --env.type=aloha --env.task="$GYM" \
            --eval.n_episodes="$EPISODES" --eval.batch_size=1 --seed=1000 \
            --output_dir=out/reference
      - name: gym-aloha side of the fidelity check
        run: |
          for task in transfer_cube insertion; do
            /tmp/ref/bin/python -I packages/neura-robots/src/neura_robots/aloha/fidelity.py \
              record --impl gym-aloha --task "$task" --dtype float32 \
              --out "out/reference/fidelity-$task.npz"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference
          path: |
            out/reference/eval_info.json
            out/reference/fidelity-*.npz
            out/reference/checkpoint

  evidence:
    name: Neura and the in-process baselines
    needs: reference
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Headless OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libosmesa6
      - name: Install (with PyTorch, LeRobot and MuJoCo)
        run: make models-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reference
          path: out/reference
      - name: Fidelity of the MuJoCo port, step for step
        run: |
          for task in transfer_cube insertion; do
            uv run --group models python -m neura_robots.aloha.fidelity record --impl neura \
              --task "$task" --dtype float32 --out "out/fidelity-$task.npz"
            uv run --group models python -m neura_robots.aloha.fidelity compare \
              "out/reference/fidelity-$task.npz" "out/fidelity-$task.npz" \
              | tee "out/fidelity-$task.json"
          done
      - name: Closed loop
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
          TASK: ${{ inputs.task }}
          EPISODES: ${{ inputs.episodes }}
          SYSTEMS: ${{ inputs.systems }}
        run: |
          # The same migrated files lerobot-eval served, so every system has the same weights.
          uv run --group models neura-evidence closed-loop --checkpoint out/reference/checkpoint \
            --source "$CHECKPOINT (migrated by LeRobot's migrate_policy_normalization)" \
            --task "$TASK" --episodes "$EPISODES" --systems "$SYSTEMS" \
            --reference out/reference/eval_info.json --out out/closed-loop.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        run: |
          if [ -f out/closed-loop.json ]; then
            python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("out/closed-loop.json"))
          print("\n| System | Success | 95% CI | Inference median (ms) |\n|---|---|---|---|")
          for name, v in d["systems"].items():
              s = v["summary"]
              low, high = s["success_rate_95ci"]
              ms = s.get("inference_ms", {}).get("median", "")
              print(f"| {name} | {s['successes']}/{s['episodes']} | {low:.0%}-{high:.0%} | {ms} |")
          if "reference" in d:
              r = d["reference"]
              print(f"\nlerobot-eval on gym-aloha: {r['lerobot_eval_success_rate']:.0%}; "
                    f"same outcome as the port on {r['same_outcome']}/{r['episodes_compared']} seeds")
          EOF
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence
          path: |
            out/closed-loop.json
            out/fidelity-*.json

  faults:
    name: The same faults for Neura and LeRobot's remote inference
    needs: reference
    if: inputs.fault_episodes > 0
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Headless OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libosmesa6
      - name: Install (with PyTorch, LeRobot and MuJoCo)
        run: make models-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reference
          path: out/reference
      - name: Faults
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
          TASK: ${{ inputs.task }}
          EPISODES: ${{ inputs.fault_episodes }}
        run: |
          uv run --group models neura-evidence faults --checkpoint out/reference/checkpoint \
            --source "$CHECKPOINT (migrated by LeRobot's migrate_policy_normalization)" \
            --task "$TASK" --episodes "$EPISODES" --out out/faults.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: faults
          path: out/faults.json
