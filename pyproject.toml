[project]
name = "neura-workspace"
version = "0.0.0"
description = "Neura monorepo workspace root (not published)."
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false
# LeRobot 0.6.1, the latest release, caps these below their security fixes (Pillow<13,
# transformers<5.6). The model tests pass with the fixed versions; drop these when LeRobot allows
# them.
override-dependencies = ["pillow>=13.0.0,<14", "transformers>=5.10.0,<5.11"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
neura-contracts = { workspace = true }
neura-proto = { workspace = true }
neura-control = { workspace = true }
neura-agent = { workspace = true }
neura-runtime = { workspace = true }
neura-server = { workspace = true }
neura-sim = { workspace = true }
neura-sdk = { workspace = true }
neura-adapters = { workspace = true }
neura-bench = { workspace = true }
neura-robots = { workspace = true }
neura-learn = { workspace = true }
neura = { workspace = true }

[dependency-groups]
dev = [
    "neura-contracts",
    "neura-proto",
    "neura-control",
    "neura-agent",
    "neura-runtime",
    "neura-server",
    "neura-sim",
    "neura-sdk",
    "neura-adapters",
    "neura-bench",
    "neura-robots",
    "neura-learn",
    "neura",
    "grpcio-tools==1.84.0",
    "httpx2>=0.1",
    "hypothesis>=6.169",
    "mypy>=2.4",
    "openapi-spec-validator>=0.9",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "types-grpcio>=1.0.0.20250914",
    "types-jsonschema>=4.23",
    "types-protobuf>=6.30",
    "types-pyyaml>=6.0.12",
]
# Real models (PyTorch, LeRobot): `uv sync --group models`. Not part of the default setup.
models = ["neura-adapters[lerobot]", "neura-robots[so101,sim]", "neura-learn[models]"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "packages/neura-proto/src/neura",
    "packages/neura-contracts/src/neura_contracts/reason_codes.py",
    "packages/neura/src/neura_cli/fleet.py",
    "packages/neura-contracts/src/neura_contracts/outbound_schema.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "C4", "PIE", "RET", "TID"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "N802"]
"tools/**" = ["S603", "S607"]
# Simulation randomness is for modeling, never for security.
"packages/neura-sim/src/**" = ["S311"]
"packages/neura-robots/src/neura_robots/emulator.py" = ["S311"]
# Token prefixes and identifier kinds, not secrets.
"packages/neura-control/src/neura_control/security/tokens.py" = ["S105"]
"packages/neura-control/src/neura_control/ids.py" = ["S105"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = [
    "neura",
    "neura_adapters",
    "neura_agent",
    "neura_bench",
    "neura_cli",
    "neura_contracts",
    "neura_control",
    "neura_robots",
    "neura_runtime",
    "neura_sdk",
    "neura_server",
    "neura_sim",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/neura/src:packages/neura-contracts/src:packages/neura-proto/src:packages/neura-control/src:packages/neura-agent/src:packages/neura-runtime/src:packages/neura-server/src:packages/neura-sim/src:packages/neura-sdk/src:packages/neura-adapters/src:packages/neura-bench/src:tools"
explicit_package_bases = true
exclude = ["packages/neura-proto/src/neura/"]

[[tool.mypy.overrides]]
module = ["neura.*"]
follow_imports = "skip"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["grpc_tools.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = ["packages", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

# PyTorch and LeRobot are optional (the models group). LeRobot ships no type information; PyTorch
# is treated the same so type checking gives the same result with and without the models group.
[[tool.mypy.overrides]]
module = [
    "lerobot.*", "torch", "torch.*", "torchvision", "torchvision.*", "mujoco", "mujoco.*",
    "tokenizers", "tokenizers.*", "transformers", "transformers.*",
    "gym_aloha", "gym_aloha.*", "PIL", "PIL.*",
    "gymnasium", "gymnasium.*", "huggingface_hub", "huggingface_hub.*",
    "safetensors", "safetensors.*",
]
ignore_missing_imports = true
follow_imports = "skip"
