# NucleiLabs site and its developer docs: static files only. No API, no cookies, no third-party requests.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/conf.d/security-headers.inc;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        # Content-hashed file names: safe to cache forever.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # The developer docs (site/, built with baseUrl /docs/). Pages are <name>.html.
    location = /docs {
        return 301 /docs/;
    }

    location /docs/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/docs-headers.inc;
        try_files $uri =404;
    }

    location /docs/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/docs-headers.inc;
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /docs/404.html;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri /index.html;
    }
}
