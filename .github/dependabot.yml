# Dependency updates (design §18.2, supply chain). Actions are pinned to commit SHAs and images
# to digests; Dependabot proposes the new pins with their version comments. Every update goes
# through CI, including the dependency audit. Updates go to main, the default branch.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: main
    schedule: {interval: weekly}
    open-pull-requests-limit: 10
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # Pinned to the MuJoCo gym-aloha's dm_control uses (neura-robots' sim extra): the ALOHA
      # port must match gym-aloha step for step, and another MuJoCo already differs by 1e-11
      # (packages/neura-robots/tests/test_aloha.py fails on it).
      - dependency-name: mujoco
  - package-ecosystem: npm
    directory: /console
    target-branch: main
    schedule: {interval: weekly}
    groups:
      console-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /landing
    target-branch: main
    schedule: {interval: weekly}
    groups:
      landing-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /site
    target-branch: main
    schedule: {interval: weekly}
    groups:
      docs-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: main
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
