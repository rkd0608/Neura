[project]
name = "neura-robots"
version = "0.1.0.dev0"
description = "Neura robot integrations: the SO-101 arm over LeRobot, a servo bus emulator, the ALOHA tasks in physics simulation, the robot-side process for arms and the hardware qualification harness."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "neura-contracts",
    "neura-proto",
    "neura-runtime",
    "neura-server",
    "neura-sim",
    "numpy>=2.2",
    "pyyaml>=6.0.2",
    "grpcio>=1.84,<2",
]

[project.scripts]
neura-arm = "neura_robots.cli:main"
neura-arm-emulator = "neura_robots.emulator:main"
neura-qualify = "neura_robots.qualify.cli:main"
neura-evidence = "neura_robots.evidence.cli:main"
neura-aloha-cell = "neura_robots.aloha.cell:main"

[project.optional-dependencies]
# Real SO-101 arms through LeRobot (its Feetech bus, calibration and cameras). LeRobot brings
# PyTorch; robot computers that run LeRobot already have it.
so101 = [
    "lerobot[feetech]>=0.6.1,<0.7",
]
# The ALOHA tasks in physics simulation (neura_robots.aloha). Pinned to the MuJoCo that
# gym-aloha's dm_control uses, so the simulation is step-for-step identical to the one LeRobot
# evaluates its published ALOHA policies on (neura_robots.aloha.fidelity).
sim = [
    "mujoco==3.16.0",
    # The robot cell's page (aloha.cell) sends its cameras as JPEG.
    "pillow>=11",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
