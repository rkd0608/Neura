# Local development stack: `make dev`. Not a production deployment.
#
# - postgres:       control-plane metadata store
# - control-plane:  management API (cloud side)
# - site-agent:     agent as it would run on a customer GPU server: dials out to the control plane,
#                   supervises the site data plane (gateway, scheduler, mock policy worker) and
#                   serves the local site API
# - sim-robots:     four simulated arms running the real robot runtime; each asks the agent which
#                   revision to run and switches revisions at a task boundary
# - console:        the web console at http://127.0.0.1:3000 (sign in with the development token)
#
# Nothing is configured by hand: `make smoke` onboards a customer through the API, enrolls the
# agent, prepares and activates a revision, approves it locally and checks the robots run it.
name: neura-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neura
      POSTGRES_PASSWORD: neura
      POSTGRES_DB: neura
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neura -d neura"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: neura-control
      secrets: [ca_bundle]
    image: neura-control:dev
    command: ["sh", "-c", "neura-control migrate && exec neura-control serve"]
    environment:
      NEURA_CONTROL_ENVIRONMENT: development
      NEURA_CONTROL_DATABASE_URL: postgresql://neura:neura@postgres:5432/neura
      NEURA_CONTROL_PUBLIC_URL: http://127.0.0.1:8080
      # DEVELOPMENT ONLY: a public admin token for the local stack. Generate another with
      # `uv run neura-control dev-token`. Refused outside the development environment.
      NEURA_CONTROL_DEV_BOOTSTRAP_TOKEN: ntk_tok_01M4Y8WAYQCVACJ83FY3EZEDKR_F_4TsgyKux5toXDLnOLpsAvLyWNlDAHK0WMN6dUBIXw
      # DEVELOPMENT ONLY: a public manifest signing seed. Generate a real one per environment and
      # keep it in a secret store; sites pin its public key at enrollment.
      NEURA_CONTROL_MANIFEST_SIGNING_KEY: YuKYhVBPES3lvjs-KJFKdi1VMCeKSHS7O877vb76GQA
      NEURA_CONTROL_AGENT_GRPC_LISTEN: 0.0.0.0:8081
      NEURA_CONTROL_AGENT_ENDPOINT: control-plane:8081
      # Neura's registry of weights sealed with customer keys (design §18.2).
      NEURA_CONTROL_SEALED_WEIGHTS_DIR: /var/lib/neura/sealed-weights
      # Prometheus metrics, apart from the API (the observability profile scrapes them).
      NEURA_CONTROL_METRICS_LISTEN: 0.0.0.0:9464
    volumes:
      - sealed-weights:/var/lib/neura/sealed-weights
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  site-agent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: neura-agent
      secrets: [ca_bundle]
    image: neura-agent:dev
    environment:
      NEURA_AGENT_STATE_DIR: /var/lib/neura/agent
      NEURA_AGENT_CONTROL_PLANE_URL: http://control-plane:8080
      NEURA_AGENT_PROBE_INTERVAL_S: "2"
      # A development stack: the settings marked DEVELOPMENT ONLY below are refused without it.
      NEURA_AGENT_DEVELOPMENT: "true"
      # DEVELOPMENT ONLY: plaintext to the control plane inside the Compose network.
      NEURA_AGENT_CONTROL_PLANE_INSECURE: "true"
      NEURA_AGENT_GATEWAY_LISTEN: 0.0.0.0:50051
      NEURA_AGENT_GATEWAY_STATUS_LISTEN: 0.0.0.0:8091
      # DEVELOPMENT ONLY: the mock policy with simulated GPU latency. The example contracts
      # carry placeholder weight digests; real sites run policy workers (the default).
      NEURA_AGENT_GATEWAY_BACKEND: simulated
      # DEVELOPMENT ONLY: a public operator credential ("ntop_dev_operator_public_token"). Real
      # sites keep the operator credential private.
      NEURA_AGENT_OPERATOR_TOKEN_SHA256: dfa754c6a45087ebcbff56b78b5367a540aa5a1235fda92aea2d96768fde6a04
      # Robots and the gateway use mutual TLS with the site CA. The robots reach the gateway as
      # "site-agent". DEVELOPMENT ONLY: the agent writes the simulated robots' keys and
      # certificates to a shared volume; real robots make their own keys and send a CSR
      # (`neura-robot keygen`, `neura-agent robot-certificate`).
      NEURA_AGENT_GATEWAY_TLS_NAMES: '["site-agent"]'
      NEURA_AGENT_DEV_ROBOT_CERTIFICATE_DIR: /var/lib/neura/robot-certs
    volumes:
      - agent-state:/var/lib/neura
      - robot-certs:/var/lib/neura/robot-certs
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:8091:8091"
    depends_on:
      control-plane:
        condition: service_healthy

  sim-robots:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: neura-sim-robots
      secrets: [ca_bundle]
    image: neura-sim-robots:dev
    environment:
      NEURA_SIM_GATEWAY: site-agent:50051
      NEURA_SIM_ASSIGNED: "true"
      NEURA_SIM_CERT_DIR: /var/lib/neura/robot-certs
      NEURA_SIM_ROBOTS: "4"
      NEURA_SIM_TASK_SECONDS: "4"
    volumes:
      - robot-certs:/var/lib/neura/robot-certs:ro
    depends_on:
      site-agent:
        condition: service_healthy

  console:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: neura-console
      secrets: [ca_bundle]
    image: neura-console:dev
    environment:
      NEURA_API_UPSTREAM: http://control-plane:8080
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      control-plane:
        condition: service_healthy

  # `docker compose --profile observability up`: Prometheus scraping every component's /metrics
  # and Grafana with Neura's dashboards (http://127.0.0.1:3001, admin/admin on first sign-in).
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      control-plane:
        condition: service_healthy

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: system
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  agent-state:
  robot-certs:
  sealed-weights:
  prometheus-data:
  grafana-data:

secrets:
  # Optional CA bundle for builds behind a TLS-intercepting proxy. Defaults to an empty file
  # here (not /dev/null: Compose's bake builder reads only files under the project).
  ca_bundle:
    file: ${NEURA_BUILD_CA_BUNDLE:-./empty-ca-bundle.pem}
