name: GPU benchmark (Modal)

# The GPU-sharing benchmark (design §9.5, §10, §16 step 0) on one NVIDIA L4 at Modal
# (deploy/modal/bench.py): ACT, Diffusion Policy, SmolVLA and pi0, robots per GPU shared by Neura
# against one GPU per robot. The same suite as the Google Cloud workflow, for an account without
# Google's GPU quota. Started by hand. Needs a Modal token in the secrets MODAL_TOKEN_ID and
# MODAL_TOKEN_SECRET, the repository's or the production environment's (modal.com → Settings →
# API Tokens). The report is uploaded as an artifact and committed to the bench-reports branch,
# under bench/reports/<gpu>/.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Modal stops the run after this many hours, finished or not (about $1.25 an hour)"
        type: number
        default: 3
      preset:
        description: "gpu: every sharing case; vla: SmolVLA and pi0 at a timing an L4 can meet, and contention to 24 workers"
        type: choice
        options: [gpu, vla]
        default: gpu
      size:
        description: "The models' size"
        type: choice
        options: [base, small, tiny]
        default: base

permissions:
  contents: read

concurrency:
  group: bench-modal
  cancel-in-progress: false

# bash -eo pipefail: a step piped into tee fails when its command does.
defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.13"
  MODAL_VERSION: "1.6.1"

jobs:
  gpu:
    name: On an L4 at Modal
    runs-on: ubuntu-24.04
    environment: production # the Modal token: a repository secret or one of this environment's
    timeout-minutes: 240
    permissions:
      contents: write # the report, committed to the bench-reports branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Benchmark
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          NEURA_BENCH_HOURS: ${{ inputs.hours }}
          # 24 co-located workers, each a process with PyTorch and CUDA loaded.
          NEURA_BENCH_MEMORY_GIB: ${{ inputs.preset == 'vla' && '64' || '32' }}
          PRESET: ${{ inputs.preset }}
          SIZE: ${{ inputs.size }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Add the MODAL_TOKEN_ID and MODAL_TOKEN_SECRET secrets: Settings → Secrets and variables → Actions"
            exit 1
          fi
          uv run --no-project --with "modal==$MODAL_VERSION" \
            modal run deploy/modal/bench.py --preset "$PRESET" --size "$SIZE" --out bench-report
      - name: Summary
        if: always()
        run: |
          [ ! -f bench-report/README.md ] || cat bench-report/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-report
          path: bench-report
          if-no-files-found: ignore
      - name: Commit the report to bench-reports
        if: success()
        run: tools/commit_bench_report.sh bench-report | tee -a "$GITHUB_STEP_SUMMARY"
