# Neura management API (design §20). Spec-first: this file is the source of truth.
# Clients and server conformance tests are derived from it. Lint rules are enforced by
# tests/api/test_openapi.py.
openapi: 3.1.1
info:
  title: Neura management API
  version: 1.0.0-alpha.1
  summary: Manage sites, servers, robots, contracts and deployments.
  description: 'The single public API used by the console, CLI, SDK and customer automation (design §20).
    It is never on the robot action path.


    Conventions:

    - Resources have `metadata`, `spec` (desired, client-set) and `status` (observed, site-reported, read-only).

    - Every POST requires `Idempotency-Key`, except read-only computations marked as such.

    - PATCH and DELETE require `If-Match` with the resource version.

    - Site-dependent work returns `202` with an Operation that succeeds only on site acknowledgement.

    - Errors are RFC 9457 problem details with a stable `reason` code.

    - Lists are cursor-paginated.


    Status: Proposed. Implementation lands in milestone M3.'
servers:
- url: https://api.example.invalid
  description: Placeholder until the domain is decided.
security:
- oidc: []
- apiToken: []
tags:
- name: Meta
- name: Organizations
- name: Projects
- name: Sites
- name: Servers
- name: Robots
- name: Contracts
- name: Deployments
- name: Operations
- name: Operations data
- name: Events
- name: Audit
- name: Access
paths:
