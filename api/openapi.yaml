    ServerPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Server'
        page:
          $ref: '#/components/schemas/PageInfo'
    ServerSpec:
      type: object
      required:
      - display_name
      - allocated_gpu_indexes
      properties:
        display_name:
          $ref: '#/components/schemas/DisplayName'
        labels:
          $ref: '#/components/schemas/Labels'
        allocated_gpu_indexes:
          type: array
          items:
            type: integer
            minimum: 0
          uniqueItems: true
          description: GPUs Neura may use; others stay untouched (design §17.2).
      additionalProperties: false
    ServerUpdate:
      type: object
      description: JSON Merge Patch (RFC 7396) of the mutable spec fields.
      properties:
        spec:
          type: object
          properties:
            display_name:
              $ref: '#/components/schemas/DisplayName'
            labels:
              $ref: '#/components/schemas/Labels'
            allocated_gpu_indexes:
              type: array
              items:
                type: integer
                minimum: 0
              uniqueItems: true
          additionalProperties: false
      additionalProperties: false
    ServiceMeta:
      type: object
      required:
      - service
      - service_version
      - api_version
      - api_spec_version
      - contracts_api_version
      - protocol_version
      properties:
        service:
          type: string
        service_version:
          type: string
        api_version:
          const: v1
        api_spec_version:
          type: string
        contracts_api_version:
          type: string
        protocol_version:
          type: string
        environment:
          type: string
    Session:
      type: object
      readOnly: true
      required:
      - metadata
      - robot_id
      - site_id
      - revision_id
      - lease_generation
      - task_epoch
      - state
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        robot_id:
          $ref: '#/components/schemas/RobotId'
        site_id:
          $ref: '#/components/schemas/SiteId'
        revision_id:
          $ref: '#/components/schemas/RevisionId'
        lease_generation:
          type: integer
          minimum: 0
        task_epoch:
          type: integer
          minimum: 0
        state:
          enum:
          - Disconnected
          - Ready
          - Armed
          - Running
          - Waiting
          - Faulted
        reason:
          oneOf:
          - $ref: '#/components/schemas/ReasonCode'
          - type: 'null'
        metrics:
          type: object
          properties:
            buffer_actions:
              type: integer
              minimum: 0
            observation_age_p99_ms:
              type: number
              minimum: 0
            deadline_misses_last_hour:
              type: integer
              minimum: 0
        data_age_seconds:
          type:
          - number
          - 'null'
          minimum: 0
    SessionId:
      type: string
      pattern: ^ses_[0-9A-HJKMNP-TV-Z]{26}$
      description: 'Session identifier: `ses_` followed by a ULID.'
      examples:
      - ses_01JA2B3C4D5E6F7G8H9JKMNPQR
    SessionPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        page:
          $ref: '#/components/schemas/PageInfo'
    Site:
      type: object
      required:
      - metadata
      - spec
      - status
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/SiteSpec'
        status:
          allOf:
          - $ref: '#/components/schemas/ObservedStatus'
          properties:
            agent_version:
              type:
              - string
              - 'null'
            connected:
              type: boolean
            offline_authorization_expires_at:
              oneOf:
              - $ref: '#/components/schemas/Timestamp'
              - type: 'null'
      additionalProperties: false
    SiteCreate:
      type: object
      required:
      - spec
      properties:
        spec:
          $ref: '#/components/schemas/SiteSpec'
      additionalProperties: false
    SiteId:
      type: string
      pattern: ^site_[0-9A-HJKMNP-TV-Z]{26}$
      description: 'Site identifier: `site_` followed by a ULID.'
      examples:
      - site_01JA2B3C4D5E6F7G8H9JKMNPQR
    SitePage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        page:
          $ref: '#/components/schemas/PageInfo'
    SiteSpec:
      type: object
      required:
      - name
      - display_name
      - offline_authorization_hours
      properties:
        name:
          $ref: '#/components/schemas/Name'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        labels:
          $ref: '#/components/schemas/Labels'
        offline_authorization_hours:
          type: integer
          minimum: 1
          maximum: 8760
          description: How long the site keeps operating on its committed configuration without reaching
            the control plane (design §13).
      additionalProperties: false
    SiteUpdate:
      type: object
      description: JSON Merge Patch (RFC 7396) of the mutable spec fields.
      properties:
        spec:
          type: object
          properties:
            display_name:
              $ref: '#/components/schemas/DisplayName'
            labels:
              $ref: '#/components/schemas/Labels'
            offline_authorization_hours:
              type: integer
              minimum: 1
              maximum: 8760
          additionalProperties: false
      additionalProperties: false
    SupportGrant:
      type: object
      description: Customer-approved, time-boxed break-glass access (design §18.2).
      required:
      - metadata
      - site_id
      - operations
      - expires_at
      - state
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        site_id:
          $ref: '#/components/schemas/SiteId'
        operations:
          type: array
          items:
            type: string
        justification:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        state:
          enum:
          - Active
          - Expired
          - Revoked
    SupportGrantCreate:
      type: object
      required:
      - site_id
      - operations
      - duration_minutes
      - justification
      properties:
        site_id:
          $ref: '#/components/schemas/SiteId'
        operations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - read_status
            - collect_diagnostics
            - prepare_revision
            - rollback
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 1440
        justification:
          type: string
          minLength: 10
          maxLength: 2000
      additionalProperties: false
    SupportGrantId:
      type: string
      pattern: ^sgr_[0-9A-HJKMNP-TV-Z]{26}$
      description: 'SupportGrant identifier: `sgr_` followed by a ULID.'
      examples:
      - sgr_01JA2B3C4D5E6F7G8H9JKMNPQR
    SupportGrantPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SupportGrant'
        page:
          $ref: '#/components/schemas/PageInfo'
    Timestamp:
      type: string
      format: date-time
