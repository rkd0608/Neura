name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # the release workflow runs all of CI on the tag first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22.20"
  PNPM_VERSION: "10.28.0"

jobs:
  checks:
    name: Lint, types, generated files, tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neura
          POSTGRES_PASSWORD: neura
          POSTGRES_DB: neura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neura -d neura"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NEURA_TEST_DATABASE_URL: postgresql://neura:neura@127.0.0.1:5432/neura
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Generated files are current
        run: make check-generated
      - name: Tests
        run: uv run pytest

  models:
    name: Models (LeRobot adapters, real workers, benchmark harness, SO-101 integration, the improvement loop)
    runs-on: ubuntu-24.04
    services:
      postgres:  # the improvement loop's end-to-end tests run the control plane
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neura
          POSTGRES_PASSWORD: neura
          POSTGRES_DB: neura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neura -d neura"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NEURA_TEST_DATABASE_URL: postgresql://neura:neura@127.0.0.1:5432/neura
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Headless OpenGL (the simulated ALOHA renders its camera)
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libosmesa6
      - name: Install (with PyTorch and LeRobot)
        run: make models-setup
      - name: Model tests and a smoke run of the benchmark
        env:
          MUJOCO_GL: egl
        run: make test-models
      - name: Hardware qualification suite on the emulated SO-101 arm
        run: make qualify-emulated

  console:
    name: Console (lint, types, unit and end-to-end tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neura
          POSTGRES_PASSWORD: neura
          POSTGRES_DB: neura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neura -d neura"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NEURA_E2E_DATABASE_URL: postgresql://neura:neura@127.0.0.1:5432/neura
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Install
        run: |
          uv sync --frozen
          make console-setup
      - name: Format, lint, types, unit tests, generated API types
        run: make console-check
      - name: Browser
        working-directory: console
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end journey
        run: make console-e2e
      - name: Report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: console/playwright-report
          retention-days: 7

  landing:
    name: NucleiLabs site (format, lint, types, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - name: Install
        run: make landing-setup
      - name: Format, lint, types, build
        run: make landing-check

  supply-chain:
    name: Supply chain (dependency audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          uv sync --frozen
          (cd console && pnpm install --frozen-lockfile)
          (cd site && pnpm install --frozen-lockfile)
      - name: Known vulnerabilities in every locked dependency
        run: uv run python tools/audit_dependencies.py

  docs:
    name: Docs site (labels, wording, links, build, quickstart)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: |
          uv sync --frozen
          make docs-setup
      - name: Labels, wording, generated references, types, build
        run: make docs-check
      - name: External links
        run: uv run python tools/check_docs.py --external
      - name: The quickstart, as written
        run: uv run python tools/check_docs.py --run-quickstart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/build
          retention-days: 7

  dev-stack:
    name: Dev stack smoke test
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Build, start and verify
        run: tools/smoke_dev_stack.sh
      - name: Policy workers in the container sandbox
        run: |
          docker build -f deploy/docker/Dockerfile --target neura-worker -t neura-worker:dev .
          NEURA_TEST_WORKER_IMAGE=neura-worker:dev uv run pytest tests/integration/test_worker_sandbox.py
      - name: A ROS 2 robot through the relay, under packet loss
        run: |
          docker build -t neura-ros2-test:dev packages/neura-robots/tests/ros2
          NEURA_TEST_ROS2_IMAGE=neura-ros2-test:dev uv run pytest packages/neura-robots/tests/test_ros2.py
