name: Release

# A release from a version tag (vX.Y.Z), after all of CI passes on it (design §17.7, §18.2):
#
# - every image is built once, pushed to GHCR by digest, scanned for known vulnerabilities (a
#   critical one stops the release), signed keyless with Sigstore (cosign, this workflow's GitHub
#   identity), with a CycloneDX SBOM attached as a signed attestation and SLSA build provenance;
# - the site-agent release bundle is built and signed with Neura's Ed25519 release key (the
#   NEURA_RELEASE_SIGNING_KEY secret), the key sites pin at install and verify every upgrade
#   against; the bundle gets an SBOM and provenance too;
# - a GitHub release lists every digest and how to verify it.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# bash -eo pipefail: a step piped into tee fails when its command does.
defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Image ${{ matrix.target }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        target:
          - neura-control
          - neura-agent
          - neura-agent-gpu
          - neura-gateway
          - neura-worker
          - neura-worker-gpu
          - neura-sim-robots
          - neura-console
          - neura-landing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.target }}
      # Where the web images link: Neura's own site and console (the NEURA_DOMAIN variable the
      # Deploy workflow uses), never a development default (tests/tools/test_web_build_urls.py).
      DOMAIN: ${{ vars.NEURA_DOMAIN || 'nucleilabs.ai' }}
      CONTACT_URL: ${{ vars.NEURA_CONTACT_URL || 'mailto:hello@nucleilabs.ai' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disk space for the CUDA images
        if: endsWith(matrix.target, '-gpu')
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          build-args: |
            VITE_CONSOLE_URL=https://console.${{ env.DOMAIN }}/sign-in
            VITE_DOCS_URL=https://${{ env.DOMAIN }}/docs/
            VITE_CONTACT_URL=${{ env.CONTACT_URL }}
            NEURA_SITE_URL=https://${{ env.DOMAIN }}
            NEURA_CONSOLE_URL=https://console.${{ env.DOMAIN }}/sign-in
            NEURA_CONTACT_URL=${{ env.CONTACT_URL }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ matrix.target }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Known vulnerabilities in the image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ matrix.target }}.cdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table
      - name: Attest the SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign attest --yes --type cyclonedx --predicate "${{ matrix.target }}.cdx.json"
          "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" > "${{ matrix.target }}.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.target }}
          path: |
            ${{ matrix.target }}.digest
            ${{ matrix.target }}.cdx.json

  agent:
    name: Site-agent release bundle
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - name: The tag is the packages' version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("packages/neura-agent/pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$TAG" || { echo "tag $TAG but neura-agent is $version"; exit 1; }
      - name: Build and sign
        env:
          NEURA_RELEASE_SIGNING_KEY: ${{ secrets.NEURA_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$NEURA_RELEASE_SIGNING_KEY" || { echo "NEURA_RELEASE_SIGNING_KEY is not set"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/release.pem"
          printf '%s\n' "$NEURA_RELEASE_SIGNING_KEY" > "$key"
          uv sync --frozen
          mkdir -p dist
          uv run python tools/build_agent_release.py build --key "$key" --out dist \
            | tee "$RUNNER_TEMP/bundle.txt"
          rm -f "$key"
          mv "$RUNNER_TEMP/bundle.txt" dist/neura-agent.sha256.txt
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: cyclonedx-json
          output-file: dist/neura-agent.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/neura-agent-*.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent
          path: dist

  release:
    name: GitHub release
    needs: [images, agent]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Images"
            echo
            echo "Every image is signed keyless by this repository's release workflow, with a signed"
            echo "CycloneDX SBOM attestation and SLSA build provenance. Deploy by digest:"
            echo
            echo '```'
            cat artifacts/image-*/*.digest
            echo '```'
            echo
            echo "Verify an image before you run it:"
            echo
            echo '```bash'
            echo "cosign verify <image>@<digest> \\"
            echo "  --certificate-identity-regexp '^https://github.com/$REPO/.github/workflows/release.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://<image>@<digest> --repo $REPO"
            echo '```'
            echo
            echo "## Site agent"
            echo
            echo "The bundle is signed with Neura's release key; the installer verifies it with"
            echo "openssl before it installs anything, and sites verify every upgrade the same way."
            echo
            echo '```'
            cat artifacts/agent/neura-agent.sha256.txt
            echo '```'
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Neura $TAG"
          --notes-file notes.md --verify-tag
          artifacts/agent/neura-agent-*.tar artifacts/agent/neura-agent.cdx.json
          artifacts/image-*/*.cdx.json
