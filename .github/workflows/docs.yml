name: Docs site

# Publishes the developer docs (design §26) to GitHub Pages from main. Every pull request builds
# the site in CI (the `docs` job) and uploads it as the `docs-site` artifact, a preview to
# download. Set NEURA_DOCS_URL and NEURA_DOCS_BASE_URL as repository variables for another host
# or domain.
on:
  push:
    branches: [main]
    paths: ["site/**", "catalog/**", "api/**", "proto/**", "packages/neura-sdk/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.28.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.20"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: |
          uv sync --frozen
          make docs-setup
      - name: Check and build
        env:
          NEURA_DOCS_URL: ${{ vars.NEURA_DOCS_URL }}
          NEURA_DOCS_BASE_URL: ${{ vars.NEURA_DOCS_BASE_URL }}
        run: make docs-check
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
