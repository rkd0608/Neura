# Dependency updates (design §18.2, supply chain). Actions are pinned to commit SHAs and images
# to digests; Dependabot proposes the new pins with their version comments. Every update goes
# through CI, including the dependency audit.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 10
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /console
    schedule: {interval: weekly}
    groups:
      console-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /landing
    schedule: {interval: weekly}
    groups:
      landing-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /site
    schedule: {interval: weekly}
    groups:
      docs-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
