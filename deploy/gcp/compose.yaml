# Neura's cloud side on one Compute Engine VM (design §20.10). deploy/gcp/deploy.sh publishes this
# file in the instance metadata and the VM's neura-apply runs it; nothing here is edited on the VM.
#
# - edge:            the only thing listening publicly (80, 443). On 443 it routes by TLS server
#                    name without decrypting agents.<domain> and enroll.<domain>, so the control
#                    plane checks site agents' client certificates itself; it terminates TLS for
#                    <domain> (the site) and console.<domain> (console and API).
# - db:              Postgres, from compose.postgres.yaml (a container whose data is on the data disk)
#                    or compose.cloudsql.yaml (the Cloud SQL proxy); deploy.sh publishes one of them
# - control-plane:   management API and the site-agent listeners
# - console:         the web console, which also proxies the API under /v1
# - landing:         the NucleiLabs site
#
# Values come from release.env (images pinned by digest, domain, database) and the secrets
# neura-apply reads from Secret Manager into /run/neura (tmpfs).
name: neura

x-control-plane: &control-plane
  image: ${CONTROL_IMAGE:?}
  env_file: /run/neura/control-plane.env # database URL with its password; manifest signing key
  environment:
    NEURA_CONTROL_ENVIRONMENT: production
    NEURA_CONTROL_PUBLIC_URL: https://console.${DOMAIN:?}
    # The database is on this host's container network: the Cloud SQL proxy does the TLS to Cloud
    # SQL, and a Postgres container is reachable from nothing else.
    NEURA_CONTROL_DATABASE_TLS_LOCAL: "true"
    NEURA_CONTROL_FORWARDED_ALLOW_IPS: 172.30.0.0/24
    NEURA_CONTROL_AGENT_GRPC_LISTEN: 0.0.0.0:8081
    NEURA_CONTROL_AGENT_ENDPOINT: agents.${DOMAIN:?}:443
    NEURA_CONTROL_AGENT_ENROLL_LISTEN: 0.0.0.0:8082
    NEURA_CONTROL_AGENT_ENROLL_ENDPOINT: enroll.${DOMAIN:?}:443
    NEURA_CONTROL_AGENT_TLS_CERT_FILE: /etc/neura/tls/fullchain.pem
    NEURA_CONTROL_AGENT_TLS_KEY_FILE: /etc/neura/tls/privkey.pem
    NEURA_CONTROL_AGENT_CLIENT_CA_CERT_FILE: /etc/neura/agent-ca/ca.crt
    NEURA_CONTROL_AGENT_CLIENT_CA_KEY_FILE: /etc/neura/agent-ca/ca.key
    NEURA_CONTROL_SEALED_WEIGHTS_DIR: /var/lib/neura/sealed-weights

services:
  migrate:
    <<: *control-plane
    # The database can take a moment to accept connections after it starts.
    command:
      - sh
      - -c
      - for i in $$(seq 30); do neura-control migrate && exit 0; sleep 2; done; exit 1
    depends_on: [db]
    restart: "no"

  control-plane:
    <<: *control-plane
    command: ["neura-control", "serve"]
    volumes:
      - /srv/neura/data/sealed-weights:/var/lib/neura/sealed-weights
      - /srv/neura/data/tls:/etc/neura/tls:ro
      - /run/neura/agent-ca.crt:/etc/neura/agent-ca/ca.crt:ro
      - /run/neura/agent-ca.key:/etc/neura/agent-ca/ca.key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  console:
    image: ${CONSOLE_IMAGE:?}
    environment:
      NEURA_API_UPSTREAM: http://control-plane:8080
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  landing:
    image: ${LANDING_IMAGE:?}
    restart: unless-stopped

  edge:
    image: mirror.gcr.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/neura/edge.conf:/etc/nginx/nginx.conf:ro
      - /srv/neura/data/tls:/etc/neura/tls:ro
      - /srv/neura/data/acme:/var/www/acme:ro
    depends_on:
      console:
        condition: service_healthy
      landing:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    # Fixed, so the control plane can trust the forwarded client address from these proxies only.
    ipam:
      config:
        - subnet: 172.30.0.0/24
