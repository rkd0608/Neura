[project]
name = "neura-adapters"
version = "0.1.0.dev0"
description = "Neura model adapters: the interface policy workers run, a deterministic mock, LeRobot policies (ACT, SmolVLA, pi0) and multi-adapter batching."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "neura-contracts",
    "neura-runtime",
    "numpy>=2.2",
    "pyyaml>=6.0.2",
]

[project.scripts]
neura-adapters = "neura_adapters.cli:main"

[project.optional-dependencies]
# Real models. Heavy (PyTorch and its CUDA libraries); installed on GPU servers and for the
# model tests and benchmarks, not for the control plane or the default development setup.
lerobot = [
    # SmolVLA and pi0 run on Hugging Face Transformers (LeRobot's smolvla and pi extras); the
    # dataset extra reads and writes LeRobot datasets, for training on captured episodes.
    "lerobot[diffusion,smolvla,pi,dataset]>=0.6.1,<0.7",
    "torch>=2.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
