[project]
name = "neura-runtime"
version = "0.1.0.dev0"
description = "Neura robot runtime: action queue, chunk merging, fencing, state machine and session client."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "neura-contracts",
    "neura-proto",
    "numpy>=2.2",
    "grpcio>=1.84,<2",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
