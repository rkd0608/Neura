name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22.20"
  PNPM_VERSION: "10.28.0"

jobs:
  checks:
    name: Lint, types, generated files, tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neura
          POSTGRES_PASSWORD: neura
          POSTGRES_DB: neura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neura -d neura"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NEURA_TEST_DATABASE_URL: postgresql://neura:neura@127.0.0.1:5432/neura
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Generated files are current
        run: make check-generated
      - name: Tests
        run: uv run pytest

  models:
    name: Models (LeRobot adapters, real workers, benchmark harness)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install (with PyTorch and LeRobot)
        run: make models-setup
      - name: Model tests and a smoke run of the benchmark
        run: make test-models

  console:
    name: Console (lint, types, unit and end-to-end tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neura
          POSTGRES_PASSWORD: neura
          POSTGRES_DB: neura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neura -d neura"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NEURA_E2E_DATABASE_URL: postgresql://neura:neura@127.0.0.1:5432/neura
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Install
        run: |
          uv sync --frozen
          make console-setup
      - name: Format, lint, types, unit tests, generated API types
        run: make console-check
      - name: Browser
        working-directory: console
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end journey
        run: make console-e2e
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: console/playwright-report
          retention-days: 7

  docs:
    name: Docs site (labels, wording, links, build, quickstart)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: |
          uv sync --frozen
          make docs-setup
      - name: Labels, wording, generated references, types, build
        run: make docs-check
      - name: External links
        run: uv run python tools/check_docs.py --external
      - name: The quickstart, as written
        run: uv run python tools/check_docs.py --run-quickstart
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/build
          retention-days: 7

  dev-stack:
    name: Dev stack smoke test
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Build, start and verify
        run: tools/smoke_dev_stack.sh
      - name: Policy workers in the container sandbox
        run: |
          docker build -f deploy/docker/Dockerfile --target neura-worker -t neura-worker:dev .
          NEURA_TEST_WORKER_IMAGE=neura-worker:dev uv run pytest tests/integration/test_worker_sandbox.py
