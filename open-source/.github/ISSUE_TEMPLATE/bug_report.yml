name: Bug report
description: Something neura-robot did that it shouldn't have, or didn't do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A safety-rule bypass (an action reaching the controller that should have been refused) or
        a vulnerability? Please report it privately instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, configuration (with secrets removed) and policy, as small as you can.
  - type: textarea
    id: record
    attributes:
      label: Incident record or logs
      description: |
        If a robot was involved, attach its incident record (incidents/*.mcap): it replays the
        runtime's decisions. Logs: set NEURA_LOG_LEVEL=debug.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`pip show neura-robot`, or the commit"
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Python version, OS, architecture, robot and policy transport
