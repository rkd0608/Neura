[project]
name = "neura-robots"
version = "0.1.0.dev0"
description = "Neura robot integrations: the SO-101 arm over LeRobot, a servo bus emulator, ROS 2 robots, the ALOHA tasks in physics simulation and the robot-side process for arms."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "neura-contracts",
    "neura-proto",
    "neura-runtime",
    "numpy>=2.2",
    "pyyaml>=6.0.2",
    "grpcio>=1.84,<2",
]

[project.scripts]
neura-arm = "neura_robots.cli:main"
neura-arm-emulator = "neura_robots.emulator:main"
neura-aloha-cell = "neura_robots.aloha.cell:main"

[project.optional-dependencies]
# Real SO-101 arms through LeRobot (its Feetech bus, calibration and cameras). LeRobot brings
# PyTorch; robot computers that run LeRobot already have it.
so101 = [
    "lerobot[feetech]>=0.6.1,<0.7",
]
# The ALOHA tasks in physics simulation (neura_robots.aloha). Pinned to the MuJoCo that
# gym-aloha's dm_control uses, so the simulation is step-for-step identical to the one LeRobot
# evaluates its published ALOHA policies on (neura_robots.aloha.fidelity). Dependabot leaves it
# alone (.github/dependabot.yml); tests/test_aloha.py fails on any other MuJoCo.
sim = [
    "mujoco==3.8.1",
    # The robot cell's page (aloha.cell) sends its cameras as JPEG.
    "pillow>=11",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

# Published as neura-robot, which runs on robot computers' own Python: 3.10 and later (design §30).
[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py310"
