[project]
name = "neura-workspace"
version = "0.0.0"
description = "Neura monorepo workspace root (not published)."
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
neura-contracts = { workspace = true }
neura-proto = { workspace = true }
neura-control = { workspace = true }
neura-agent = { workspace = true }

[dependency-groups]
dev = [
    "neura-contracts",
    "neura-proto",
    "neura-control",
    "neura-agent",
    "grpcio-tools==1.84.0",
    "httpx2>=0.1",
    "hypothesis>=6.169",
    "mypy>=2.4",
    "openapi-spec-validator>=0.9",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "types-grpcio>=1.0.0.20250914",
    "types-protobuf>=6.30",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "packages/neura-proto/src/neura",
    "packages/neura-contracts/src/neura_contracts/reason_codes.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "C4", "PIE", "RET", "TID"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "N802"]
"tools/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["neura", "neura_agent", "neura_contracts", "neura_control"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/neura-contracts/src:packages/neura-proto/src:packages/neura-control/src:packages/neura-agent/src:tools"
explicit_package_bases = true
exclude = ["packages/neura-proto/src/neura/"]

[[tool.mypy.overrides]]
module = ["neura.*"]
follow_imports = "skip"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["grpc_tools.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = ["packages", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
